- question_id: G16
  type: join
  language: id
  question: Berapa total defect kategori Las?
  reference_sql: SELECT SUM(d.qty) AS total_defect FROM defect_log d JOIN dim_defect x ON x.defect_code = d.defect_code WHERE x.category = 'Las'
- question_id: G17
  type: join
  language: en
  question: Which defect name has the highest quantity?
  reference_sql: SELECT x.defect_name, SUM(d.qty) AS total_defect FROM defect_log d JOIN dim_defect x ON x.defect_code = d.defect_code GROUP BY x.defect_name ORDER BY total_defect DESC, x.defect_name LIMIT 1
- question_id: G18
  type: join
  language: id
  question: Berapa total defect di Frame Painting menurut nama defect?
  reference_sql: SELECT x.defect_name, SUM(d.qty) AS total_defect FROM defect_log d JOIN dim_defect x ON x.defect_code = d.defect_code WHERE d.station = 'Frame Painting' GROUP BY x.defect_name ORDER BY x.defect_name
- question_id: G19
  type: join
  language: en
  question: How many defects of category Cat occurred for model Sport 150?
  reference_sql: SELECT SUM(d.qty) AS total_defect FROM defect_log d JOIN dim_defect x ON x.defect_code = d.defect_code WHERE x.category = 'Cat' AND d.model = 'Sport 150'
- question_id: G20
  type: join
  language: id
  question: Berapa total defect kategori Kelistrikan per stasiun?
  reference_sql: SELECT d.station, SUM(d.qty) AS total_defect FROM defect_log d JOIN dim_defect x ON x.defect_code = d.defect_code WHERE x.category = 'Kelistrikan' GROUP BY d.station ORDER BY d.station
- question_id: G21
  type: join
  language: en
  question: List the stations in production order with their total NG quantity.
  reference_sql: SELECT s.station, SUM(p.ng_qty) AS total_ng FROM v_production p JOIN dim_station s ON s.station = p.station GROUP BY s.station, s.seq ORDER BY s.seq
- question_id: G22
  type: definisi KPI
  language: id
  question: Berapa FPY Engine Assembly?
  reference_sql: SELECT SUM(ok_first_pass) * 1.0 / SUM(input_qty) AS fpy FROM v_production WHERE station = 'Engine Assembly'
- question_id: G23
  type: definisi KPI
  language: en
  question: Which station has the lowest FPY?
  reference_sql: SELECT station, SUM(ok_first_pass) * 1.0 / SUM(input_qty) AS fpy FROM v_production GROUP BY station ORDER BY fpy, station LIMIT 1
- question_id: G24
  type: definisi KPI
  language: id
  question: Berapa NG rate per model?
  reference_sql: SELECT model, SUM(ng_qty) * 1.0 / SUM(input_qty) AS ng_rate FROM v_production GROUP BY model ORDER BY model
- question_id: G25
  type: definisi KPI
  language: en
  question: What is the RTY of the line for Bebek 125?
  reference_sql: WITH f AS (SELECT station, SUM(ok_first_pass) * 1.0 / SUM(input_qty) AS fpy FROM v_production WHERE model = 'Bebek 125' GROUP BY station) SELECT EXP(SUM(LN(fpy))) AS rty FROM f
- question_id: G26
  type: definisi KPI
  language: id
  question: Berapa defect per 1.000 unit di Main Line Assembly?
  reference_sql: SELECT (SELECT SUM(qty) FROM defect_log WHERE station = 'Main Line Assembly') * 1000.0 / (SELECT SUM(input_qty) FROM v_production WHERE station = 'Main Line Assembly') AS defect_per_1000
- question_id: G27
  type: definisi KPI
  language: en
  question: What is the overall yield of the line?
  reference_sql: WITH f AS (SELECT station, SUM(ok_first_pass) * 1.0 / SUM(input_qty) AS fpy FROM v_production GROUP BY station) SELECT EXP(SUM(LN(fpy))) AS rty FROM f
