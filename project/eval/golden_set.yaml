# Golden set 30 pertanyaan (ditulis manual). reference_sql kosong = jawaban benar adalah meminta klarifikasi.
- question_id: G01
  type: agregasi
  language: id
  question: Berapa total unit yang masuk Engine Assembly selama seluruh periode?
  reference_sql: SELECT SUM(input_qty) AS total_input FROM v_production WHERE station = 'Engine Assembly'
- question_id: G02
  type: agregasi
  language: id
  question: Berapa total NG di Frame Painting?
  reference_sql: SELECT SUM(ng_qty) AS total_ng FROM v_production WHERE station = 'Frame Painting'
- question_id: G03
  type: agregasi
  language: en
  question: How many units passed first pass at Final Inspection in total?
  reference_sql: SELECT SUM(ok_first_pass) AS total_ok FROM v_production WHERE station = 'Final Inspection'
- question_id: G04
  type: agregasi
  language: id
  question: Berapa rata-rata jumlah input per catatan untuk model Sport 150?
  reference_sql: SELECT AVG(input_qty) AS avg_input FROM v_production WHERE model = 'Sport 150'
- question_id: G05
  type: agregasi
  language: en
  question: What is the total NG quantity per station?
  reference_sql: SELECT station, SUM(ng_qty) AS total_ng FROM v_production GROUP BY station ORDER BY station
- question_id: G06
  type: agregasi
  language: id
  question: Berapa total defect per model?
  reference_sql: SELECT model, SUM(qty) AS total_defect FROM defect_log GROUP BY model ORDER BY model
- question_id: G07
  type: agregasi
  language: en
  question: Which station has the highest total NG quantity?
  reference_sql: SELECT station, SUM(ng_qty) AS total_ng FROM v_production GROUP BY station ORDER BY total_ng DESC, station LIMIT 1
- question_id: G08
  type: agregasi
  language: id
  question: Berapa jumlah hari produksi di data?
  reference_sql: SELECT COUNT(DISTINCT date) AS hari_produksi FROM v_production
